name: image

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 5 * * 1"
  push:
    branches: [main]

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: JonathanLemes/dayfold
  UPSTREAM_REF: ${{ vars.UPSTREAM_REF || 'main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      merge: ${{ steps.check.outputs.merge }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream
        id: check
        run: |
          git fetch "https://github.com/${UPSTREAM}.git" "${UPSTREAM_REF}"
          UP_SHA=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$UP_SHA" HEAD; then
            CHANGED=false
          else
            CHANGED=true
          fi
          FORCE=false
          case "${GITHUB_EVENT_NAME}" in push|workflow_dispatch) FORCE=true ;; esac
          if [ "${{ github.event.schedule }}" = "0 5 * * 1" ]; then FORCE=true; fi
          MERGE=false
          if [ "$CHANGED" = true ] && [ "${GITHUB_EVENT_NAME}" != push ]; then MERGE=true; fi
          BUILD=false
          if [ "$CHANGED" = true ] || [ "$FORCE" = true ]; then BUILD=true; fi
          {
            echo "merge=$MERGE"
            echo "build=$BUILD"
            echo "upstream_sha=$UP_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "upstream changed: $CHANGED, build: $BUILD (upstream ${UP_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream (local only)
        if: needs.check.outputs.merge == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/${UPSTREAM}.git" "${{ needs.check.outputs.upstream_sha }}"
          git merge --no-edit FETCH_HEAD

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check dayfold tests

      - name: Test
        working-directory: backend
        run: uv run pytest -q

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit

      # Fails, rather than skipping, when LuaJIT is unavailable: the plugin's catalogue and
      # reader hooks are only covered here.
      - name: KOReader plugin tests
        run: make test-koreader

  build:
    needs: [check, verify]
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream (local only)
        if: needs.check.outputs.merge == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/${UPSTREAM}.git" "${{ needs.check.outputs.upstream_sha }}"
          git merge --no-edit FETCH_HEAD

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (${{ matrix.arch }})
        id: build
        working-directory: deploy
        env:
          # Satisfies compose variable interpolation if the file requires it.
          # Runtime variable only; the guard below fails the build if it leaks into the image.
          DAYFOLD_PASSWORD: ci-build-only
        run: |
          set -euo pipefail
          docker compose build
          SRC=$(docker compose config --images | head -n1)

          META=$( { docker image inspect "$SRC"; docker history --no-trunc "$SRC"; } )
          if grep -q ci-build-only <<<"$META"; then
            echo "::error::DAYFOLD_PASSWORD was baked into the image"
            exit 1
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Smoke test (${{ matrix.arch }})
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8422:8422 \
            -e DAYFOLD_PASSWORD=smoke-test -e DAYFOLD_DISABLE_SCHEDULER=1 \
            "${{ steps.build.outputs.src }}"
          OK=0
          for i in $(seq 30); do
            if curl -fsS http://localhost:8422/api/health; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" != 1 ]; then
            echo "::error::health endpoint never came up"
            docker logs smoke
            exit 1
          fi
          curl -fsS http://localhost:8422/ | grep -qi '<html'
          docker rm -f smoke

      - name: Push arch image & export digest
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dayfold"
          SHA=$(git rev-parse --short HEAD)
          ARCH_TAG="${REPO}:sha-${SHA}-${{ matrix.arch }}"

          docker tag "${{ steps.build.outputs.src }}" "$ARCH_TAG"
          docker push "$ARCH_TAG"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ARCH_TAG" | cut -d'@' -f2)
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/${{ matrix.arch }}"
          echo "Pushed ${ARCH_TAG} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  publish:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # push the merge commit to your fork after a green build
      packages: write            # push the multi-arch manifest to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream (local only)
        if: needs.check.outputs.merge == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/${UPSTREAM}.git" "${{ needs.check.outputs.upstream_sha }}"
          git merge --no-edit FETCH_HEAD

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dayfold"
          SHA=$(git rev-parse --short HEAD)
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)

          for TAG in latest "sha-${SHA}"; do
            docker buildx imagetools create -t "${REPO}:${TAG}" \
              "${REPO}@${AMD64_DIGEST}" \
              "${REPO}@${ARM64_DIGEST}"
          done
          echo "Published multi-arch manifest ${REPO}:sha-${SHA} and :latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Advance fork main
        if: needs.check.outputs.merge == 'true'
        run: |
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" \
            || echo "::warning::could not push merge commit (main moved?). Image is published; next poll will re-merge."

