services:
  dayfold:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8422:8422"
    volumes:
      - dayfold-data:/data
    environment:
      - DAYFOLD_PASSWORD=${DAYFOLD_PASSWORD:-}
      - DAYFOLD_LANGUAGE=${DAYFOLD_LANGUAGE:-pt}
    restart: unless-stopped
volumes:
  dayfold-data:
